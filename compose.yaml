services:
  mysql:
    image: mysql:8.4

    container_name: lenslink-mysql

    environment:
      MYSQL_ROOT_PASSWORD: test1234
      MYSQL_DATABASE: lenslink

    ports:
      - "3307:3306"
  app:
    build: .
    container_name: lenslink-app

    depends_on:
      - mysql

    restart: unless-stopped

    ports:
      - "8080:8080"