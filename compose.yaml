services:
  mysql:
    image: mysql:8.4
    container_name: lenslink-mysql

    environment:
      MYSQL_ROOT_PASSWORD: test1234
      MYSQL_DATABASE: lenslink
      SPRING_PROFIES_ACTIVE: docker

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD" , "mysqladmin" , "ping", "-h", "localhost", "-uroot", "-ptest1234"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    container_name: lenslink-app

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

    ports:
      - "8080:8080"

volumes:
  mysql-data: