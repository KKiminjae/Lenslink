name: LensLink CD

on:
  workflow_run:
    workflows: ["LensLink CI"]
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: lenslink-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Resolve deployment image tag
        id: deploy_vars
        run: |
          FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"
          IMAGE_TAG="sha-${SHORT_SHA}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Full SHA: ${FULL_SHA}"
          echo "Docker image tag: ${IMAGE_TAG}"

      - name: Inspect OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization":
                      "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * ((4 - len(payload) % 4) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in [
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "repository_id",
              "repository_owner_id",
              "ref",
              "event_name"
          ]:
              print(f"{key}={claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::452183714891:role/LensLinkGitHubDeployRole
          aws-region: ap-northeast-2
          allowed-account-ids: 452183714891

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/ubuntu/LensLink

            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
            git fetch origin main

            if git ls-tree -r --name-only "${DEPLOY_SHA}" -- .env | grep -qx '.env'; then
              echo "ERROR: .env must not be tracked by Git."
              exit 1
            fi

            git checkout --detach "${DEPLOY_SHA}"

            ./scripts/deploy.sh \
              "${{ steps.deploy_vars.outputs.image_tag }}"