name: LensLink CD

on:
  workflow_run:
    workflows: ["LensLink CI"]
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: lenslink-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Resolve deployment image tag
        id: deploy_vars
        run: |
          FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"
          IMAGE_TAG="sha-${SHORT_SHA}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Full SHA: ${FULL_SHA}"
          echo "Docker image tag: ${IMAGE_TAG}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::452183714891:role/LensLinkGitHubDeployRole
          aws-region: ap-northeast-2
          allowed-account-ids: 452183714891

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Send deployment command
        id: ssm_send
        env:
          INSTANCE_ID: i-04d86620cc8253899
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE_TAG: ${{ steps.deploy_vars.outputs.image_tag }}
        run: |
          set -euo pipefail

          REMOTE_COMMAND=$(cat <<EOF
          sudo -iu ubuntu bash -lc '
          set -euo pipefail

          cd /home/ubuntu/LensLink

          git fetch origin main

          if git ls-tree -r --name-only "${DEPLOY_SHA}" -- .env | grep -qx ".env"; then
            echo "ERROR: .env must not be tracked by Git."
            exit 1
          fi

          git checkout --detach "${DEPLOY_SHA}"

          ./scripts/deploy.sh "${IMAGE_TAG}"
          '
          EOF
          )

          PARAMETERS=$(jq -n \
            --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "LensLink deploy ${DEPLOY_SHA:0:7}" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment
        env:
          INSTANCE_ID: i-04d86620cc8253899
          COMMAND_ID: ${{ steps.ssm_send.outputs.command_id }}
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=120
          SLEEP_SECONDS=5

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Attempt ${i}/${MAX_ATTEMPTS} - Status: ${STATUS}"

            case "$STATUS" in
              Success)
                echo "SSM deployment succeeded."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
                  --output json

                exit 0
                ;;

              Failed|TimedOut|Cancelled)
                echo "ERROR: SSM deployment failed with status: ${STATUS}"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
                  --output json

                exit 1
                ;;

              Pending|InProgress|Delayed|Cancelling|"")
                sleep "$SLEEP_SECONDS"
                ;;

              *)
                echo "Waiting for SSM command. Current status: ${STATUS}"
                sleep "$SLEEP_SECONDS"
                ;;
            esac
          done

          echo "ERROR: Timed out waiting for SSM deployment."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json || true

          exit 1